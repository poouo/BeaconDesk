# BeaconDesk connection server configuration.
# For production, set tls_cert_file/tls_key_file and change
# allow_insecure_plaintext to false.
listen = ":8443"
transport = "websocket"
websocket_path = "/ws"
web_control_enabled = true
web_control_path = "/web"
# In TCP transport mode, set a separate HTTP listener for browser control links.
# In WebSocket transport mode, browser control is served from listen automatically.
web_listen = ":8080"
# Set this when serving through a domain or reverse proxy, for example:
# public_base_url = "https://relay.example.com"
shared_token = "change-me"
# tls_cert_file = "/etc/beacondesk/tls/fullchain.pem"
# tls_key_file = "/etc/beacondesk/tls/privkey.pem"
heartbeat_timeout_seconds = 45
max_clients = 1000
bandwidth_limit_kbps = 4096
allow_insecure_plaintext = true
