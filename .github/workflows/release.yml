name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            suffix: linux-armv7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -ldflags "-s -w -X github.com/poouo/BeaconDesk/pkg/version.Version=${GITHUB_REF_NAME} -X github.com/poouo/BeaconDesk/pkg/version.Commit=${GITHUB_SHA}" -o dist/beacondesk-relay-${{ matrix.suffix }} ./cmd/relay-server
      - uses: actions/upload-artifact@v4
        with:
          name: beacondesk-relay-${{ matrix.suffix }}
          path: dist/beacondesk-relay-${{ matrix.suffix }}

  windows-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build Windows client
        run: |
          mkdir dist
          go build -tags "desktop,production" -ldflags "-H windowsgui -s -w -X github.com/poouo/BeaconDesk/pkg/version.Version=${env:GITHUB_REF_NAME} -X github.com/poouo/BeaconDesk/pkg/version.Commit=${env:GITHUB_SHA}" -o dist/beacondesk-client-windows-amd64.exe ./cmd/client-windows
      - uses: actions/upload-artifact@v4
        with:
          name: beacondesk-client-windows-amd64
          path: dist/beacondesk-client-windows-amd64.exe

  publish:
    needs:
      - build
      - windows-client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
